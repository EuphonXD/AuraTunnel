name: build-ipa
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode
        run: xcodebuild -version
      - name: Build unsigned
        run: |
          set -o pipefail
          xcodebuild -project EasyVPN-App.xcodeproj -scheme AuraTunnel \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build.log
      - name: Package IPA
        run: |
          APP=$(find build -name 'AuraTunnel.app' -type d | head -1)
          test -n "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr AuraTunnel-unsigned.ipa Payload
          ls -lh AuraTunnel-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: AuraTunnel-ipa
          path: AuraTunnel-unsigned.ipa
