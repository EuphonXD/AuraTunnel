[package]
name = "leaf-ffi"
version = "0.1.0"
authors = ["eycorsican <eric.y.corsican@gmail.com>"]
edition = "2021"

[lib]
name = "leaf"
path = "src/lib.rs"
# AuraTunnel embeds Leaf as a static XCFramework. Avoid producing an unused
# iOS dylib and its extra link pass.
crate-type = ["staticlib"]

[features]
default = [
    "default-aws-lc",
    "auto-reload",
]

default-aws-lc= [
    "leaf/default-aws-lc",
]

default-ring = [
    "leaf/default-ring",
]

default-openssl = [
    "leaf/default-openssl",
]

auratunnel-ios = [
    "leaf/config-json",
    "leaf/inbound-tun",
    "leaf/netstack-lwip",
    "leaf/outbound-direct",
    "leaf/outbound-drop",
    "leaf/outbound-chain",
    "leaf/outbound-socks",
    "leaf/outbound-shadowsocks",
    "leaf/outbound-trojan",
    "leaf/outbound-vmess",
    "leaf/outbound-vless",
    "leaf/outbound-tls",
    "leaf/outbound-ws",
    "leaf/ring-aead",
    "leaf/rustls-tls",
    "leaf/rustls-tls-ring",
]

auto-reload = ["leaf/auto-reload"]

[dependencies]
leaf = { path = "../leaf", default-features = false, optional = true }
tokio = { version = "1", features = ["rt"] }
anyhow = "1.0"
futures = "0.3"
