[General]
ipv6 = false
prefer-ipv6 = false
dns-server = 223.5.5.5, 119.29.29.29
fallback-dns-server = 1.1.1.1, 8.8.8.8
always-real-ip = localhost, *.local, captive.apple.com, *.apple.com, *.icloud.com
